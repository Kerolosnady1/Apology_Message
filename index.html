<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="preloader">
        <svg viewBox="0 0 600 552">
            <path d="M300,107.77C284.68,55.67,239.76,0,162.31,0,64.83,0,0,82.08,0,171.71c0,.48,0,.95,0,1.43-.52,19.5,0,217.94,299.87,379.69v0l0,0,.05,0,0,0,0,0v0C600,391.08,600.48,192.64,600,173.14c0-.48,0,.95,0-1.43C600,82.08,535.17,0,437.69,0,360.24,0,315.32,55.67,300,107.77" fill="#ff0000"/>
        </svg>
    </div>
    
    <div id="youtube-player" style="position: absolute; visibility: hidden; width: 1px; height: 1px;"></div>
    
    <div id="app">
        <div id="envelope" class="envelope">
            <div class="flap"></div>
            <div class="letter-preview">Click to Open</div>
        </div>
        <div id="letter" class="letter hidden">
            <div class="letter-content">
                <div class="heart"></div>
                <h2>My Dearest,</h2>
                <p>I am truly sorry for everything. I know I messed up, and I want to make things right. You mean everything to me, and I hope you can forgive me.</p>
                <p>With all my love,</p>
            </div>
        </div>
        
        <div id="music-player" class="music-player hidden">
            <button id="pause-btn" class="player-btn">⏸️</button>
            <button id="play-btn" class="player-btn">▶️</button>
            <div class="song-info">
                <span>Apology Song</span>
            </div>
        </div>
    </div>
    
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src='https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js'></script>
    <script src='https://unpkg.co/gsap@3/dist/gsap.min.js'></script>
    <script src="script.js"></script>
</body>
</html>
